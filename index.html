<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier Safari Spotter</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Plane cursor ── */
*, *::before, *::after { cursor: none !important; }
#cursor {
  position: fixed;
  pointer-events: none;
  z-index: 99999;
  width: 40px;
  height: 40px;
  transform: translate(-50%, -50%);
  transition: transform 0.05s ease;
  font-size: 28px;
  line-height: 1;
}

/* ── Full page safari background ── */
html, body {
  min-height: 100%;
  width: 100%;
}

body {
  font-family: 'Nunito', sans-serif;
  background: #87CEEB;
  background: linear-gradient(180deg, #87CEEB 0%, #b0dff5 45%, #c8efc0 70%, #7ec850 85%, #5a9e38 100%);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 6rem;
}

/* ── Sky decorations ── */
.cloud {
  position: fixed;
  background: rgba(255,255,255,0.82);
  border-radius: 50px;
  pointer-events: none;
  z-index: 0;
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: rgba(255,255,255,0.82);
  border-radius: 50%;
}
.c1 { width:120px;height:40px;top:8%;left:5%; animation: drift 18s linear infinite; }
.c1::before { width:60px;height:60px;top:-30px;left:15px; }
.c1::after { width:40px;height:40px;top:-20px;left:55px; }
.c2 { width:90px;height:30px;top:18%;left:70%; animation: drift 24s linear infinite reverse; }
.c2::before { width:50px;height:50px;top:-25px;left:10px; }
.c2::after { width:35px;height:35px;top:-15px;left:45px; }
.c3 { width:70px;height:25px;top:6%;left:45%; animation: drift 20s linear infinite; }
.c3::before { width:40px;height:40px;top:-20px;left:8px; }
.c3::after { width:28px;height:28px;top:-12px;left:36px; }
@keyframes drift { 0%{transform:translateX(0)} 50%{transform:translateX(30px)} 100%{transform:translateX(0)} }

/* ── Sun ── */
.sun {
  position: fixed;
  top: 30px; right: 60px;
  width: 70px; height: 70px;
  background: #FFD600;
  border-radius: 50%;
  box-shadow: 0 0 0 12px rgba(255,214,0,0.25), 0 0 0 24px rgba(255,214,0,0.12);
  z-index: 0;
  pointer-events: none;
}

/* ── Ground / grass ── */
.ground {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  z-index: 0;
  pointer-events: none;
}
.grass-back {
  position: absolute;
  bottom: 40px; left: 0; right: 0;
  height: 50px;
  background: #5a9e38;
  border-radius: 60% 60% 0 0 / 30px 30px 0 0;
}
.grass-front {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 44px;
  background: #3d7a22;
  border-radius: 50% 50% 0 0 / 20px 20px 0 0;
}

/* ── Safari animals in scene ── */
.scene-animal {
  position: fixed;
  font-size: 42px;
  bottom: 30px;
  z-index: 1;
  pointer-events: none;
  animation: wobble 3s ease-in-out infinite;
}
.sa-giraffe { right: 6%; font-size: 56px; bottom: 28px; animation-delay: 0.3s; }
.sa-elephant { left: 3%; animation-delay: 0.8s; }
.sa-zebra { left: 18%; font-size: 36px; bottom: 32px; animation-delay: 1.2s; }
.sa-lion { right: 22%; font-size: 38px; bottom: 32px; animation-delay: 0.5s; }
@keyframes wobble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

/* ── Flying plane in sky ── */
.flying-plane {
  position: fixed;
  font-size: 32px;
  top: 12%;
  z-index: 1;
  pointer-events: none;
  animation: flyacross 22s linear infinite;
  opacity: 0.9;
}
@keyframes flyacross {
  0%   { left: -80px; top: 12%; }
  25%  { top: 8%; }
  50%  { top: 14%; }
  75%  { top: 10%; }
  100% { left: 110%; top: 12%; }
}

/* ── Binoculars watcher ── */
.watcher {
  position: fixed;
  right: 0px;
  bottom: 48px;
  font-size: 52px;
  z-index: 2;
  pointer-events: none;
  animation: watch 4s ease-in-out infinite;
  transform-origin: bottom center;
}
@keyframes watch { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

/* ── App card ── */
.app {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 500px;
  background: rgba(255,253,240,0.97);
  border-radius: 28px;
  border: 4px solid #e65100;
  box-shadow: 0 8px 0 #bf360c, 0 14px 40px rgba(0,0,0,0.2);
  overflow: hidden;
  margin-top: 1rem;
}

/* ── Banner ── */
.banner {
  background: #f9a825;
  border-bottom: 4px solid #e65100;
  padding: 1.1rem 1.5rem 0.9rem;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.banner-stripes {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(45deg, transparent, transparent 14px, rgba(255,255,255,0.15) 14px, rgba(255,255,255,0.15) 28px);
}
.banner-peekers {
  position: absolute;
  bottom: -4px; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 12px;
  pointer-events: none;
}
.peeker { font-size: 34px; position: relative; z-index: 2; }
.banner-content { position: relative; z-index: 1; }
.banner-title {
  font-family: 'Fredoka One', cursive;
  font-size: 30px;
  color: #3e2723;
  letter-spacing: 0.5px;
  line-height: 1;
}
.banner-sub {
  font-size: 12px;
  font-weight: 800;
  color: #6d4c41;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 3px;
}

/* ── Body ── */
.body { padding: 1.25rem 1.25rem 1.5rem; }

.search-label {
  font-size: 13px;
  font-weight: 800;
  color: #4a8a2e;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 6px;
}

.input-row { display: flex; gap: 8px; margin-bottom: 1rem; }

.input-row input {
  flex: 1;
  font-family: 'Fredoka One', cursive;
  font-size: 28px;
  letter-spacing: 0.12em;
  padding: 10px 14px;
  border: 3px solid #a5d6a7;
  border-radius: 14px;
  outline: none;
  color: #2e7d32;
  background: #f1f8e9;
  transition: border-color 0.15s;
  cursor: none;
}
.input-row input:focus { border-color: #4caf50; background: #fff; box-shadow: 0 0 0 3px rgba(76,175,80,0.2); }
.input-row input::placeholder { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0; color: #b2dfdb; }

.find-btn {
  background: #e65100;
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 0 18px;
  font-family: 'Fredoka One', cursive;
  font-size: 17px;
  cursor: none;
  box-shadow: 0 5px 0 #bf360c;
  transition: transform 0.08s, box-shadow 0.08s;
  white-space: nowrap;
}
.find-btn:hover { background: #bf360c; }
.find-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #bf360c; }
.find-btn:disabled { background: #bcaaa4; box-shadow: 0 5px 0 #8d6e63; transform: none; }

.status { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #388e3c; min-height: 22px; margin-bottom: 0.75rem; }
.spinner { width: 18px; height: 18px; border: 3px solid #c8e6c9; border-top-color: #388e3c; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Result card ── */
.card { border: 3px solid #a5d6a7; border-radius: 18px; padding: 1.1rem; display: none; background: #f9fef5; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, #66bb6a 0, #66bb6a 16px, #a5d6a7 16px, #a5d6a7 32px); }
.card.show { display: block; }

.animal-row { display: flex; align-items: center; gap: 14px; margin: 10px 0 1rem; }
.emoji-bubble { width: 82px; height: 82px; border-radius: 50%; background: #fff9c4; border: 3px solid #f9a825; display: flex; align-items: center; justify-content: center; font-size: 50px; flex-shrink: 0; box-shadow: 0 4px 0 #f57f17; }
.animal-name { font-family: 'Fredoka One', cursive; font-size: 22px; color: #2e7d32; line-height: 1.1; }
.animal-species { font-size: 13px; font-weight: 700; color: #78909c; margin-top: 3px; }
.aircraft-badge { display: inline-block; background: #e8f5e9; border: 2px solid #a5d6a7; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 800; color: #388e3c; margin-top: 5px; }

.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; border-top: 2px dashed #c8e6c9; padding-top: 0.85rem; margin-bottom: 0.75rem; }
.stat { background: #fff; border: 2px solid #e8f5e9; border-radius: 12px; padding: 8px 10px; text-align: center; }
.stat-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: #81c784; margin-bottom: 3px; }
.stat-val { font-family: 'Fredoka One', cursive; font-size: 15px; color: #2e7d32; }

.live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: #2e7d32; background: #e8f5e9; border: 2px solid #a5d6a7; border-radius: 20px; padding: 3px 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.live-dot { width: 7px; height: 7px; background: #4caf50; border-radius: 50%; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.err { background: #fff8e1; border: 2px solid #ffcc02; border-radius: 14px; padding: 0.9rem 1rem; font-size: 14px; font-weight: 700; color: #5d4037; line-height: 1.6; }
.unknown-tail { background: #fff3e0; border: 2px solid #ffb74d; border-radius: 14px; padding: 0.9rem 1rem; font-size: 14px; font-weight: 700; color: #e65100; line-height: 1.6; }
.unknown-tail a { color: #bf360c; }

.paw-trail { display: flex; gap: 4px; justify-content: center; margin: 0.75rem 0 0; opacity: 0.3; font-size: 13px; letter-spacing: 5px; }
.footer { font-size: 11px; font-weight: 700; color: #a5c8a0; margin-top: 0.5rem; text-align: center; text-transform: uppercase; letter-spacing: 0.06em; }
.footer a { color: #81c784; }
</style>
</head>

const input = document.getElementById('flightNum');
const statusEl = document.getElementById('status');
const card = document.getElementById('card');
const btn = document.getElementById('goBtn');

// Custom cursor
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});
document.addEventListener('mousedown', () => cursor.style.transform = 'translate(-50%,-50%) scale(0.8) rotate(10deg)');
document.addEventListener('mouseup', () => cursor.style.transform = 'translate(-50%,-50%) scale(1) rotate(0deg)');

// Lookup handlers
btn.addEventListener('click', lookup);
input.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
input.addEventListener('input', () => { input.value = input.value.replace(/[^0-9]/g, ''); });

function setStatus(msg, spinning) {
  statusEl.innerHTML = spinning
    ? '<div class="spinner"></div><span>' + msg + '</span>'
    : msg ? '<span>' + msg + '</span>' : '';
}

async function lookup() {
  const raw = input.value.trim();
  if (!raw) return;

  card.classList.remove('show');
  card.innerHTML = '';
  btn.disabled = true;
  setStatus('🔭 Scanning the skies...', true);

  try {
    const callsign = 'FFT' + raw;
    const resp = await fetch(WORKER_URL + '?callsign=' + callsign);
    if (!resp.ok) throw new Error('Server returned ' + resp.status);
    const data = await resp.json();

    if (data.error && (!data.ac || data.ac.length === 0)) throw new Error(data.error);

    const aircraft = data.ac;
    if (!aircraft || aircraft.length === 0) {
      setStatus('');
      card.innerHTML = '<div class="err">🌿 <strong>Flight F9 ' + raw + ' not spotted!</strong><br>The plane may be on the ground and not yet broadcasting. Try again once the flight is airborne.</div>';
      card.classList.add('show');
      return;
    }

    const ac = aircraft[0];
    const tail = (ac.r || '').toUpperCase().trim();
    const altitude = ac.alt_baro;
    const speed = ac.gs ? Math.round(ac.gs) : null;

    setStatus('');
    renderResult(tail, altitude, speed, raw);

  } catch(e) {
    setStatus('');
    card.innerHTML = '<div class="err">🦏 <strong>Safari radio error:</strong> ' + e.message + '<br>Check your connection and try again.</div>';
    card.classList.add('show');
  } finally {
    btn.disabled = false;
  }
}

function fmtAlt(a) {
  if (a === undefined || a === null) return '—';
  if (a === 'ground') return 'On ground';
  return Number(a).toLocaleString() + ' ft';
}

function renderResult(tail, altitude, speed, flightNum) {
  const animal = FLEET[tail];
  if (!animal) {
    card.innerHTML = '<div class="unknown-tail">🐆 <strong>' + (tail || 'Unknown tail') + '</strong> — this animal is hiding! Not in the safari guide yet.<br><br><a href="https://www.flightradar24.com/data/aircraft/' + (tail||'').toLowerCase() + '" target="_blank">Track ' + tail + ' on Flightradar24 →</a></div><div style="margin-top:0.75rem;font-size:13px;color:#a1887f;font-weight:700;">Flight: F9 ' + flightNum + ' · Tail: ' + (tail||'unknown') + '</div>';
    card.classList.add('show');
    return;
  }
  card.innerHTML =
    '<div class="animal-row">' +
      '<div class="emoji-bubble">' + animal.emoji + '</div>' +
      '<div>' +
        '<div class="animal-name">' + animal.name + '</div>' +
        '<div class="animal-species">' + animal.species + '</div>' +
        '<span class="aircraft-badge">✈️ Airbus ' + animal.ac + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="stat-label">Tail #</div><div class="stat-val">' + tail + '</div></div>' +
      '<div class="stat"><div class="stat-label">Altitude</div><div class="stat-val">' + fmtAlt(altitude) + '</div></div>' +
      '<div class="stat"><div class="stat-label">Speed</div><div class="stat-val">' + (speed ? speed + ' kts' : '—') + '</div></div>' +
    '</div>' +
    '<div><span class="live-badge"><span class="live-dot"></span> Live sighting · adsb.fi</span></div>';
  card.classList.add('show');
}
